<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en-us" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
        <nav class="topnav" aria-label="Main navigation">
          <a href="{{ "/" | relURL }}#about">About</a>
          <a href="{{ "/" | relURL }}#posts">Posts</a>
        </nav>
      </header>

      <main>
        {{ block "main" . }}{{ end }}
      </main>

      {{ partial "footer.html" . }}
    </div>
  </body>
</html>
